<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A55E0"/>
      <stop offset="100%" stop-color="#7C7FF2"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="56" y1="71" x2="80" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#12B76A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGrad)"/>

  <!-- resume sheet: large and dominant -->
  <rect x="15" y="9" width="56" height="80" rx="9" fill="#FFFFFF"/>

  <!-- CA / US market badges -->
  <circle cx="49" cy="17.5" r="4.3" fill="#1D4ED8"/>
  <g transform="translate(49,17.5) scale(1.1)" fill="#FFFFFF">
    <path d="M0,-2 L0.470,-0.647 L1.902,-0.618 L0.761,0.247 L1.176,1.618 L0,0.8 L-1.176,1.618 L-0.761,0.247 L-1.902,-0.618 L-0.470,-0.647 Z"/>
  </g>

  <circle cx="59" cy="17.5" r="4.3" fill="#E11D48"/>
  <g transform="translate(59,17.5) scale(1.05)" fill="#FFFFFF">
    <path d="M0,-2.3 L0.9,-0.6 L2.2,-0.9 L1.1,0.5 L1.9,1.9 L0,1.0 L-1.9,1.9 L-1.1,0.5 L-2.2,-0.9 L-0.9,-0.6 Z"/>
    <line x1="0" y1="1.0" x2="0" y2="2.5" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>

  <!-- text lines -->
  <rect x="23" y="25" width="32" height="4.4" rx="2.2" fill="#5A55E0"/>

  <!-- AI-polished line: highlighter effect -->
  <rect x="21" y="35" width="38" height="9" rx="4.5" fill="#FFE9A8"/>
  <rect x="24" y="37.3" width="30" height="4.4" rx="2.2" fill="#4338CA"/>

  <rect x="23" y="51" width="32" height="4.4" rx="2.2" fill="#C9CBFA"/>
  <rect x="23" y="61" width="21" height="4.4" rx="2.2" fill="#C9CBFA"/>

  <!-- skill tag chips -->
  <rect x="23" y="72" width="15" height="7.5" rx="3.75" fill="#EEF0FF"/>
  <rect x="41" y="72" width="10" height="7.5" rx="3.75" fill="#EEF0FF"/>

  <!-- ATS score meter, embedded into the sheet's corner -->
  <circle cx="68" cy="83" r="15.5" fill="#FFFFFF"/>
  <circle cx="68" cy="83" r="12" fill="none" stroke="#E4E4EC" stroke-width="4"/>
  <circle cx="68" cy="83" r="12" fill="none" stroke="url(#scoreGrad)" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="64 75.4"
          transform="rotate(-90 68 83)"/>
  <path d="M63 84.5 L66.3 87.8 L73.5 79" fill="none" stroke="#12B76A"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
